<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Change Order</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="container mt-5">
  <h1>Edit Change Order</h1>

  <form action="/change-orders/{{ change_order['id'] }}/edit" method="POST">
    <input type="hidden" name="id" value="{{ change_order['id'] }}">
    <input type="hidden" name="project_id" value="{{ change_order['project_id'] }}">

    <div class="mb-3">
      <label for="change_order_number" class="form-label">Change Order Number</label>
      <input type="text" class="form-control" id="change_order_number" name="change_order_number" value="{{ change_order['change_order_number'] }}">
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" name="description">{{ change_order['description'] }}</textarea>
    </div>

    <div class="mb-3">
      <label for="change_order_date" class="form-label">Change Order Date</label>
      <input type="date" class="form-control" id="change_order_date" name="change_order_date" value="{{ change_order['change_order_date'] }}">
    </div>

    <div class="mb-3">
      <label for="status" class="form-label">Status</label>
      <select class="form-select" id="status" name="status">
          <option value="draft" {{ 'selected' if change_order['status'] == 'draft' }}>Draft</option>
          <option value="submitted" {{ 'selected' if change_order['status'] == 'submitted' }}>Submitted</option>
          <option value="approved" {{ 'selected' if change_order['status'] == 'approved' }}>Approved</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</body>
</html>
