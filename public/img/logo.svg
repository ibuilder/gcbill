<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Define Gradients and Filters -->
  <defs>
    <filter id="logo-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="crane-red-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="crane-dark-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34495e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="building-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="gc-text-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="bill-text-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background - Subtle Blueprint Grid -->
  <rect x="10" y="10" width="280" height="80" rx="8" ry="8" fill="#f8f9fa" opacity="0.7"/>
  <g opacity="0.05">
    <path d="M10,30 L290,30" stroke="#3498db" stroke-width="0.5"/>
    <path d="M10,50 L290,50" stroke="#3498db" stroke-width="0.5"/>
    <path d="M10,70 L290,70" stroke="#3498db" stroke-width="0.5"/>
    <path d="M50,10 L50,90" stroke="#3498db" stroke-width="0.5"/>
    <path d="M90,10 L90,90" stroke="#3498db" stroke-width="0.5"/>
    <path d="M130,10 L130,90" stroke="#3498db" stroke-width="0.5"/>
    <path d="M170,10 L170,90" stroke="#3498db" stroke-width="0.5"/>
    <path d="M210,10 L210,90" stroke="#3498db" stroke-width="0.5"/>
    <path d="M250,10 L250,90" stroke="#3498db" stroke-width="0.5"/>
  </g>
  
  <!-- Building/Construction Site -->
  <g transform="translate(40, 28)">
    <!-- Modern Building Structure -->
    <rect x="0" y="30" width="60" height="40" rx="2" ry="2" fill="url(#building-gradient)" filter="url(#logo-shadow)"/>
    
    <!-- Windows -->
    <rect x="10" y="40" width="10" height="10" rx="1" ry="1" fill="#3498db" opacity="0.7"/>
    <rect x="25" y="40" width="10" height="10" rx="1" ry="1" fill="#3498db" opacity="0.7"/>
    <rect x="40" y="40" width="10" height="10" rx="1" ry="1" fill="#3498db" opacity="0.7"/>
    <rect x="10" y="55" width="10" height="10" rx="1" ry="1" fill="#3498db" opacity="0.7"/>
    <rect x="25" y="55" width="10" height="10" rx="1" ry="1" fill="#3498db" opacity="0.7"/>
    <rect x="40" y="55" width="10" height="10" rx="1" ry="1" fill="#3498db" opacity="0.7"/>
    
    <!-- Construction Crane - Professional Design -->
    <g transform="translate(75, -10)">
      <!-- Crane Base Structure -->
      <rect x="-5" y="70" width="30" height="10" rx="1" ry="1" fill="url(#crane-dark-gradient)" filter="url(#logo-shadow)"/>
      
      <!-- Crane Tower -->
      <rect x="5" y="10" width="10" height="60" rx="1" ry="1" fill="url(#crane-red-gradient)" filter="url(#logo-shadow)"/>
      
      <!-- Crane Top Section -->
      <rect x="3" y="8" width="14" height="6" rx="1" ry="1" fill="url(#crane-dark-gradient)" filter="url(#logo-shadow)"/>
      
      <!-- Crane Horizontal Jib (Arm) -->
      <rect x="-40" y="8" width="90" height="6" rx="1" ry="1" fill="url(#crane-red-gradient)" filter="url(#logo-shadow)"/>
      
      <!-- Crane Counterweight -->
      <rect x="40" y="8" width="15" height="12" rx="1" ry="1" fill="url(#crane-dark-gradient)" filter="url(#logo-shadow)"/>
      
      <!-- Crane Diagonal Supports -->
      <path d="M5,20 L-20,8 M15,20 L40,8" stroke="#c0392b" stroke-width="2" opacity="0.7"/>
      
      <!-- Crane Cables -->
      <line x1="-20" y1="14" x2="-20" y2="40" stroke="#34495e" stroke-width="1"/>
      <line x1="0" y1="14" x2="0" y2="35" stroke="#34495e" stroke-width="1"/>
      <line x1="30" y1="14" x2="30" y2="30" stroke="#34495e" stroke-width="1"/>
      
      <!-- Crane Hooks -->
      <rect x="-22" y="40" width="4" height="4" rx="1" ry="1" fill="#7f8c8d" filter="url(#logo-shadow)"/>
      <rect x="-2" y="35" width="4" height="4" rx="1" ry="1" fill="#7f8c8d" filter="url(#logo-shadow)"/>
      <rect x="28" y="30" width="4" height="4" rx="1" ry="1" fill="#7f8c8d" filter="url(#logo-shadow)"/>
    </g>
  </g>
  
  <!-- Company Name - Modern Typography -->
  <g transform="translate(160, 50)">
    <!-- "gc" Text -->
    <text font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="url(#gc-text-gradient)" filter="url(#logo-shadow)">gc</text>
    
    <!-- "Bill" Text -->
    <text x="0" y="28" font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="url(#bill-text-gradient)" filter="url(#logo-shadow)">Bill</text>
  </g>
  
  <!-- Tagline -->
  <text x="160" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Construction Management Solutions</text>
  
  <!-- Subtle Decorative Elements -->
  <line x1="127" y1="48" x2="127" y2="72" stroke="#ecf0f1" stroke-width="2"/>
  <line x1="193" y1="48" x2="193" y2="72" stroke="#ecf0f1" stroke-width="2"/>
</svg>