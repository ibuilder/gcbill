<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Define Shadow Filter and Gradients -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2" flood-color="#000"/>
    </filter>
    <linearGradient id="blueprintGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Document Stack - More Professional with Shadow -->
  <rect x="14" y="22" width="36" height="28" fill="#f8f9fa" filter="url(#shadow)" rx="3" ry="3"/>
  <rect x="18" y="18" width="36" height="28" fill="#e9ecef" filter="url(#shadow)" rx="3" ry="3"/>
  <rect x="22" y="14" width="36" height="28" fill="#ffffff" filter="url(#shadow)" rx="3" ry="3"/>
  
  <!-- Blueprint Overlay - More Professional -->
  <rect x="22" y="14" width="36" height="28" fill="url(#blueprintGradient)" rx="3" ry="3" opacity="0.2"/>
  
  <!-- Document Lines - Cleaner -->
  <line x1="28" y1="22" x2="50" y2="22" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="28" x2="50" y2="28" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="34" x2="42" y2="34" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Blueprint Grid Lines -->
  <g opacity="0.3">
    <line x1="28" y1="18" x2="28" y2="38" stroke="#3498db" stroke-width="0.5"/>
    <line x1="34" y1="18" x2="34" y2="38" stroke="#3498db" stroke-width="0.5"/>
    <line x1="40" y1="18" x2="40" y2="38" stroke="#3498db" stroke-width="0.5"/>
    <line x1="46" y1="18" x2="46" y2="38" stroke="#3498db" stroke-width="0.5"/>
    <line x1="26" y1="20" x2="54" y2="20" stroke="#3498db" stroke-width="0.5"/>
    <line x1="26" y1="26" x2="54" y2="26" stroke="#3498db" stroke-width="0.5"/>
    <line x1="26" y1="32" x2="54" y2="32" stroke="#3498db" stroke-width="0.5"/>
  </g>
  
  <!-- Crane Blueprint Element - More Professional -->
  <g transform="translate(42,34) scale(0.15)" opacity="0.8">
    <rect x="0" y="20" width="10" height="10" fill="#e74c3c" rx="1" ry="1"/>
    <rect x="4" y="0" width="2" height="20" fill="#e74c3c" rx="1" ry="1"/>
    <rect x="-6" y="0" width="16" height="2" fill="#e74c3c" rx="1" ry="1"/>
    <line x1="0" y1="2" x2="0" y2="8" stroke="#2c3e50" stroke-width="1"/>
  </g>
</svg>