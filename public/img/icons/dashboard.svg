<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Dashboard Background with subtle shadow -->
  <rect x="8" y="8" width="48" height="48" rx="6" ry="6" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Define Shadow Filter -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2" flood-color="#000"/>
    </filter>
  </defs>
  
  <!-- Charts - Cleaner with consistent spacing -->
  <rect x="14" y="16" width="18" height="14" rx="3" ry="3" fill="#3498db" opacity="0.9"/>
  <rect x="36" y="16" width="14" height="14" rx="3" ry="3" fill="#e74c3c" opacity="0.9"/>
  <rect x="14" y="34" width="14" height="14" rx="3" ry="3" fill="#2ecc71" opacity="0.9"/>
  <rect x="32" y="34" width="18" height="14" rx="3" ry="3" fill="#f1c40f" opacity="0.9"/>
  
  <!-- Data Visualization Elements -->
  <polyline points="17,26 20,22 23,24 26,19 29,23" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bar Chart Elements -->
  <rect x="38" y="24" width="2" height="4" fill="#ffffff"/>
  <rect x="42" y="22" width="2" height="6" fill="#ffffff"/>
  <rect x="46" y="20" width="2" height="8" fill="#ffffff"/>
  
  <!-- Small Crane Element - More Subtle and Professional -->
  <g transform="translate(22, 40) scale(0.18)">
    <rect x="0" y="30" width="12" height="10" fill="#2c3e50" rx="1" ry="1"/>
    <rect x="4" y="0" width="4" height="30" fill="#e74c3c" rx="1" ry="1"/>
    <rect x="-10" y="0" width="30" height="4" fill="#e74c3c" rx="1" ry="1"/>
    <line x1="0" y1="4" x2="0" y2="16" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>