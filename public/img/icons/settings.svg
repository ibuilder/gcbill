<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Define Gradients and Filters -->
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="gear-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95a5a6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7f8c8d;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="center-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="inner-gear-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Circular Background -->
  <circle cx="32" cy="32" r="30" fill="#ffffff" filter="url(#drop-shadow)"/>
  
  <!-- Main Gear - More Detailed and Professional -->
  <path d="M32,8 L35,16 C38,16.5 41,17.5 43.5,19 L51,15 L48,23 C50,25 51.5,28 52.5,31 L60,32 L54,39 C54,42 53,44.5 51.5,47 L56,53 L48,51 C46,53 43.5,54.5 40.5,55.5 L40,63 L32,58 C29,58 26.5,57 24,55.5 L16,59 L19,51 C17,49 15.5,46 14.5,43 L7,42 L13,35 C13,32 14,29.5 15.5,27 L11,21 L19,23 C21,21 23.5,19.5 26.5,18.5 L27,11 L32,8 Z" 
        fill="url(#gear-gradient)" filter="url(#drop-shadow)"/>
  
  <!-- Inner Gear Circle -->
  <circle cx="32" cy="32" r="14" fill="url(#inner-gear-gradient)" filter="url(#drop-shadow)"/>
  
  <!-- Center of Gear with Construction Theme -->
  <circle cx="32" cy="32" r="10" fill="#2c3e50" opacity="0.1"/>
  <circle cx="32" cy="32" r="8" fill="url(#center-gradient)" filter="url(#drop-shadow)"/>
  
  <!-- Gear Teeth Highlights -->
  <path d="M32,8 L35,16 M51,15 L48,23 M60,32 L54,39 M56,53 L48,51 M40,63 L32,58 M16,59 L19,51 M7,42 L13,35 M11,21 L19,23 M27,11 L32,8" 
        stroke="#ecf0f1" stroke-width="0.5" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Construction Elements - Tower Crane Silhouette -->
  <g transform="translate(32,32) scale(0.2)">
    <!-- Tower Base -->
    <rect x="-6" y="15" width="12" height="10" rx="1" ry="1" fill="#ffffff" filter="url(#drop-shadow)"/>
    
    <!-- Vertical Tower -->
    <rect x="-2" y="-15" width="4" height="30" rx="1" ry="1" fill="#ffffff" filter="url(#drop-shadow)"/>
    
    <!-- Horizontal Jib -->
    <rect x="-20" y="-15" width="40" height="4" rx="1" ry="1" fill="#ffffff" filter="url(#drop-shadow)"/>
    
    <!-- Hook Line -->
    <line x1="-10" y1="-11" x2="-10" y2="0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Hook -->
    <path d="M-11,0 C-11,2 -9,2 -9,0 Z" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Subtle Detail Lines -->
  <circle cx="32" cy="32" r="20" stroke="#bdc3c7" stroke-width="0.5" fill="none" opacity="0.5"/>
  <circle cx="32" cy="32" r="26" stroke="#bdc3c7" stroke-width="0.5" fill="none" opacity="0.3"/>
</svg>