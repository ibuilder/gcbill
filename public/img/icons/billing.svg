<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Define Shadow Filter -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2" flood-color="#000"/>
    </filter>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- Invoice Background with shadow -->
  <rect x="10" y="10" width="44" height="44" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="6" ry="6" filter="url(#shadow)"/>
  
  <!-- Invoice Header -->
  <rect x="10" y="10" width="44" height="10" fill="url(#headerGradient)" rx="6" ry="6"/>
  <rect x="10" y="15" width="44" height="5" fill="url(#headerGradient)"/>
  
  <!-- Invoice Lines - Cleaner and More Structured -->
  <rect x="16" y="26" width="32" height="1.5" fill="#ecf0f1"/>
  <rect x="16" y="32" width="32" height="1.5" fill="#ecf0f1"/>
  <rect x="16" y="38" width="32" height="1.5" fill="#ecf0f1"/>
  <rect x="16" y="44" width="20" height="1.5" fill="#ecf0f1"/>
  
  <!-- Total Box -->
  <rect x="36" y="42" width="12" height="6" rx="2" ry="2" fill="#2c3e50" opacity="0.1"/>
  
  <!-- Dollar Symbol - Sleeker -->
  <text x="42" y="47" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#e74c3c">$</text>
  
  <!-- Small Crane Icon - More Refined -->
  <g transform="translate(18, 16) scale(0.15)">
    <rect x="0" y="30" width="12" height="10" fill="#ffffff" rx="1" ry="1"/>
    <rect x="4" y="0" width="4" height="30" fill="#ffffff" rx="1" ry="1"/>
    <rect x="-10" y="0" width="30" height="4" fill="#ffffff" rx="1" ry="1"/>
    <line x1="0" y1="4" x2="0" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>