<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Define Shadow Filter -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2" flood-color="#000"/>
    </filter>
    <linearGradient id="helmetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="26" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Main Person -->
  <g transform="translate(0,-2)">
    <!-- Professional Head -->
    <circle cx="32" cy="24" r="8" fill="#3498db"/>
    
    <!-- Construction Helmet -->
    <path d="M32,16 C27,16 24,18 23,22 C22.5,24 25,25 32,25 C39,25 41.5,24 41,22 C40,18 37,16 32,16 Z" fill="url(#helmetGradient)"/>
    <path d="M28,16 L36,16" stroke="#c0392b" stroke-width="1"/>
    
    <!-- Body -->
    <path d="M32,32 L32,46" stroke="#3498db" stroke-width="4" stroke-linecap="round"/>
    <path d="M24,39 L40,39" stroke="#3498db" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Side Figures - More Professional -->
  <g opacity="0.8">
    <!-- Left Person -->
    <circle cx="18" cy="28" r="5" fill="#f1c40f"/>
    <path d="M18,33 L18,44" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>
    <path d="M13,38 L23,38" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Right Person -->
    <circle cx="46" cy="28" r="5" fill="#2ecc71"/>
    <path d="M46,33 L46,44" stroke="#2ecc71" stroke-width="3" stroke-linecap="round"/>
    <path d="M41,38 L51,38" stroke="#2ecc71" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>